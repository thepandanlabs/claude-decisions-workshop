[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decisions"
version = "0.1.0"
description = "Meeting transcript processor — decisions and action items CLI"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25",
    "click>=8.1",
]

[project.scripts]
decisions = "decisions.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/decisions"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
